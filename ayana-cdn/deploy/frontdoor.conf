# OPTIONAL: only if something else on this VPS must keep receiving
# connections on :443 alongside the edge.
#
# nginx reads the TLS SNI without decrypting anything: the CDN hostname goes
# to the edge, everything else to your existing tunnel service, still
# end-to-end encrypted.
#
# To use it:
#   1. Move your existing tunnel service from :443 to 127.0.0.1:4443.
#   2. In /etc/ayana-cdn/config.json set
#        "listen": "127.0.0.1:8443",
#        "proxy_protocol": true
#      so the edge still sees real client IPs (logs, per-IP limits). Only
#      loopback may send PROXY headers by default ("proxy_protocol_trusted").
#   3. nginx allows one stream {} block: merge this into yours if you have one.
#      Needs the stream module (Debian/Ubuntu: libnginx-mod-stream).
#   4. Apply: ayana-cdn restart   (the listen address changed)
#             nginx -t && systemctl reload nginx
#
# Clients that send a bug-host SNI (anything but the CDN hostname) take the
# "default" route. If those should reach the edge, make the edge the default
# and list your other services' hostnames instead.

stream {
    map $ssl_preread_server_name $ayana_route {
        default                 127.0.0.1:4444;   # existing tunnel service (via the hop below)
        cdn.example.com   127.0.0.1:8443;   # ayana-cdn
    }

    # Public :443: route by SNI and pass the real client IP on (PROXY protocol).
    server {
        listen 443 reuseport backlog=8192;
        # listen [::]:443 reuseport backlog=8192;   # enable only if this VPS has IPv6,
        #                                           # or nginx will refuse to start
        ssl_preread     on;
        proxy_protocol  on;
        proxy_timeout   1h;    # idle limit; tunnels with keepalives stay up
        proxy_pass      $ayana_route;
    }

    # proxy_protocol above applies to every route. This hop accepts that header
    # and forwards the plain stream, because most tunnel servers do not speak
    # PROXY protocol (v1's front door sent them the header anyway, breaking
    # them). If yours does, point the map straight at it and drop this block.
    server {
        listen 127.0.0.1:4444 proxy_protocol;
        proxy_timeout 1h;
        proxy_pass    127.0.0.1:4443;   # <-- your existing tunnel service
    }
}
