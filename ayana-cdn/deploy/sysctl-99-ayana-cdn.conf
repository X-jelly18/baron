# /etc/sysctl.d/99-ayana-cdn.conf  (installed by install.sh; apply: sysctl --system)
# Tuning for an edge that holds many long-lived tunnels and opens one backend
# connection per tunnel. A leading "-" means: skip quietly if this kernel
# does not have the setting (missing module), instead of failing.

# BBR + fair queueing: better throughput on lossy mobile and long-haul paths.
-net.core.default_qdisc = fq
-net.ipv4.tcp_congestion_control = bbr

# Buffer ceilings. Autotuning grows only the buffers that need it; these lift
# the cap for fast clients on high-latency links.
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.ipv4.tcp_rmem = 4096 131072 33554432
net.ipv4.tcp_wmem = 4096 16384 33554432

# UDP relay: each session's socket and the shared listen socket need room to
# absorb bursts. rmem_max/wmem_max above also cap SetReadBuffer/SetWriteBuffer,
# so the edge's 4 MiB request is honoured instead of clamped.
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384

# Keep unsent data in socket buffers small: interactive traffic (SSH) inside
# a tunnel is not stuck behind megabytes of bulk data. Throughput unaffected.
net.ipv4.tcp_notsent_lowat = 131072

# Absorb reconnect storms (every client reconnecting at once after an outage).
net.core.somaxconn = 8192
net.ipv4.tcp_max_syn_backlog = 8192
net.core.netdev_max_backlog = 16384

# Outbound dials to backends: more source ports and safe TIME-WAIT reuse.
net.ipv4.ip_local_port_range = 10000 65535
net.ipv4.tcp_tw_reuse = 1

# Long-lived tunnels: no slow start after idle, recover from MTU black holes.
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1

# Connection tracking headroom (only if the conntrack module is loaded):
# one entry per client connection plus one per backend connection.
-net.netfilter.nf_conntrack_max = 262144

# fs.file-max is deliberately not set here: on current kernels the default is
# effectively unlimited and a fixed value would lower it. install.sh raises it
# only if it is below 2097152.
